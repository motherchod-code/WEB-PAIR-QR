<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rabbit Xmd • WhatsApp Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0908;
      --surface: rgba(245,238,224,0.035);
      --border: rgba(227,165,69,0.14);
      --amber: #e3a545;
      --amber-soft: #f4c56b;
      --rose: #b1462e;
      --text: #f5eee0;
      --muted: rgba(245,238,224,0.42);
    }

    html { width: 100%; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(130px); pointer-events: none; z-index: 0; }
    .orb-1 {
      width: 620px; height: 620px;
      background: radial-gradient(circle, rgba(227,165,69,0.10), transparent 70%);
      top: -220px; left: -200px;
      animation: drift1 20s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 460px; height: 460px;
      background: radial-gradient(circle, rgba(177,70,46,0.10), transparent 70%);
      bottom: -160px; right: -160px;
      animation: drift2 24s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(90px, 70px); } }
    @keyframes drift2 { to { transform: translate(-70px, -90px); } }

    /* ── SIGNATURE: warren rings behind brand ── */
    .rings {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      z-index: 0;
      pointer-events: none;
    }
    .rings span {
      position: absolute; top: 50%; left: 50%;
      border: 1px solid rgba(227,165,69,0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ping 4.5s cubic-bezier(0.2,0.6,0.4,1) infinite;
      opacity: 0;
    }
    .rings span:nth-child(2) { animation-delay: 1.5s; }
    .rings span:nth-child(3) { animation-delay: 3s; }
    @keyframes ping {
      0%   { width: 10px; height: 10px; opacity: 0.6; }
      70%  { opacity: 0.08; }
      100% { width: 620px; height: 620px; opacity: 0; }
    }

    /* ── WRAPPER ── */
    .wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(48px, 8vh, 80px) clamp(16px, 4vw, 32px) clamp(48px, 8vh, 80px);
      width: 100%;
      max-width: 720px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--amber-soft);
      background: rgba(227,165,69,0.08);
      border: 1px solid var(--border);
      padding: 6px 18px 6px 14px;
      border-radius: 100px;
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.1s;
    }
    .badge svg { flex-shrink: 0; }

    .brand {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.2s;
    }

    .brand-name {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(3.2rem, 9.5vw, 6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-name .accent {
      font-weight: 800;
      background: linear-gradient(135deg, var(--amber), var(--amber-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 2vw, 12px);
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      margin: 32px auto;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.3s;
    }

    /* ── GRIDS ── */
    .grid-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.4s;
    }

    /* ── CARDS ── */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 22px 26px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.25s, box-shadow 0.3s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(245,238,224,0.045), transparent);
      border-radius: inherit;
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: var(--card-glow, var(--amber));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--card-glow, var(--amber));
      box-shadow: 0 16px 40px -12px var(--card-shadow, rgba(227,165,69,0.16));
    }
    .card:hover::after { opacity: 1; }

    .card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      background: var(--card-icon-bg, rgba(227,165,69,0.1));
      border: 1px solid var(--card-icon-border, rgba(227,165,69,0.25));
      color: var(--card-glow, var(--amber));
    }

    .card-label {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .card-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    .card-arrow {
      position: absolute;
      top: 20px; right: 20px;
      font-size: 18px;
      color: var(--muted);
      transition: transform 0.3s, color 0.3s;
    }
    .card:hover .card-arrow { transform: translate(3px, -3px); color: var(--text); }

    .card-qr   { --card-glow: var(--amber);      --card-shadow: rgba(227,165,69,0.16); --card-icon-bg: rgba(227,165,69,0.1);  --card-icon-border: rgba(227,165,69,0.25); }
    .card-pair { --card-glow: var(--rose);        --card-shadow: rgba(177,70,46,0.18);  --card-icon-bg: rgba(177,70,46,0.12);  --card-icon-border: rgba(177,70,46,0.28); }
    .card-tg   { --card-glow: #2CA5E0;             --card-shadow: rgba(44,165,224,0.14); --card-icon-bg: rgba(44,165,224,0.1);  --card-icon-border: rgba(44,165,224,0.25); }

    /* ── SINGLE SOCIAL LINK ── */
    .social-row { width: 100%; margin-top: 14px; animation: fadeUp 0.6s ease both; animation-delay: 0.5s; }
    .social-row .card { flex-direction: row; align-items: center; padding: 18px 22px; gap: 16px; }
    .social-row .card-arrow { top: 50%; right: 22px; transform: translateY(-50%); }
    .social-row .card:hover .card-arrow { transform: translateY(-50%) translateX(3px); }

    .footer {
      margin-top: 44px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      color: rgba(245,238,224,0.2);
      letter-spacing: 2px;
      text-align: center;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.6s;
    }

    .footer a { color: rgba(227,165,69,0.55); text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: var(--amber-soft); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOBILE ── */
    @media (max-width: 520px) {
      .grid-main { grid-template-columns: 1fr; gap: 10px; }
      .card { flex-direction: row; align-items: center; padding: 18px 52px 18px 16px; gap: 14px; border-radius: 16px; }
      .card-icon { width: 40px !important; height: 40px !important; border-radius: 11px !important; }
      .card-icon svg { width: 18px; height: 18px; }
      .card-arrow { top: 50%; right: 16px; transform: translateY(-50%); }
      .card:hover .card-arrow { transform: translateY(-50%) translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .rings span { animation: none !important; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas id="bg-canvas"></canvas>

  <div class="wrapper">
    <div class="badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 14C6 10 6 4 9 2c2 3 2 8 1 12"/>
        <path d="M16 14c2-4 2-10-1-12-2 3-2 8-1 12"/>
        <path d="M12 22c-3 0-5-2-5-5 0-2 1-3 2-3h6c1 0 2 1 2 3 0 3-2 5-5 5Z"/>
      </svg>
      Session Generator
    </div>

    <div class="brand">
      <div class="rings"><span></span><span></span><span></span></div>
      <div class="brand-name">RABBIT<span class="accent">XMD</span></div>
      <div class="brand-sub">WhatsApp Bot Platform</div>
    </div>

    <div class="divider"></div>

    <div class="grid-main">
      <a class="card card-qr" onclick="window.open('/qrpage')" href="javascript:void(0)">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/>
            <rect x="14.5" y="14.5" width="3" height="3" rx="0.6"/><rect x="18.5" y="14.5" width="3" height="3" rx="0.6"/>
            <rect x="14.5" y="18.5" width="3" height="3" rx="0.6"/><rect x="18.5" y="18.5" width="3" height="3" rx="0.6"/>
          </svg>
        </div>
        <div>
          <div class="card-label">QR Code</div>
          <div class="card-desc">Scan to link<br>your device</div>
        </div>
        <span class="card-arrow">↗</span>
      </a>

      <a class="card card-pair" onclick="window.open('/pair')" href="javascript:void(0)">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="4"/><path d="M10.3 12.7 20 3M15 4l3 3M12 7l2.5 2.5"/>
          </svg>
        </div>
        <div>
          <div class="card-label">Pair Code</div>
          <div class="card-desc">Link via<br>phone number</div>
        </div>
        <span class="card-arrow">↗</span>
      </a>
    </div>

    <div class="social-row">
      <a class="card card-tg" onclick="window.open('https://t.me/rabbitxmd')" href="javascript:void(0)">
        <div class="card-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </div>
        <div>
          <div class="card-label">Telegram</div>
          <div class="card-desc">@rabbitxmd — Support &amp; updates</div>
        </div>
        <span class="card-arrow">↗</span>
      </a>
    </div>

    <div class="footer">
      Built by <a href="https://t.me/rabbitxmd" target="_blank">Mr.Rabbit</a> &nbsp;•&nbsp; Rabbit Xmd
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, nodes = [], animId;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      const count = Math.min(Math.floor((W * H) / 16000), 65);
      for (let i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          r: Math.random() * 1.5 + 0.5,
          opacity: Math.random() * 0.4 + 0.1
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > W) a.vx *= -1;
        if (a.y < 0 || a.y > H) a.vy *= -1;
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(227,165,69,${(1 - dist / 140) * 0.11})`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(227,165,69,${a.opacity})`;
        ctx.fill();
      }
      animId = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
      cancelAnimationFrame(animId);
      resize(); initNodes(); draw();
    });

    resize(); initNodes(); draw();
  </script>
</body>
</html>
